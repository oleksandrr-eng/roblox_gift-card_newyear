<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1838">
<title>New Year Gift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b1838; --night2:#13275a; --gold:#ffd45e; --gold-d:#e8a215; --red:#e5303f; --red-d:#9e1222; --ice:#dcecff;
  --text:#fff; --muted:rgba(220,236,255,.7); --line:rgba(200,225,255,.2); --green:#22c55e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;background:#050a18;color:var(--text);font-family:'Fredoka',system-ui,-apple-system,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center}

.phone{position:relative;flex:none;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#071027 0%,#0d1d47 40%,#183a78 72%,#2a5596 100%)}
@media (max-width:499px){ .phone{position:fixed;top:0;left:0;transform-origin:0 0} }
@media (min-width:500px){
  body{background:radial-gradient(900px 600px at 30% 20%,#13254f,#050a18 70%)}
  .phone{border-radius:54px;box-shadow:0 0 0 11px #161616,0 0 0 13px #2a2a2a,0 40px 120px rgba(0,0,0,.8),0 0 160px rgba(90,150,255,.25)}
  .phone::before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:95}
}

/* ---------- winter night ---------- */
.aurora{position:absolute;left:-30%;right:-30%;top:40px;height:320px;z-index:0;pointer-events:none;filter:blur(28px);opacity:.55;
  background:radial-gradient(40% 35% at 30% 45%,rgba(60,255,190,.55),transparent 70%),radial-gradient(35% 30% at 70% 35%,rgba(120,110,255,.5),transparent 70%),radial-gradient(30% 25% at 52% 60%,rgba(60,200,255,.4),transparent 70%);
  animation:aur 14s ease-in-out infinite alternate}
@keyframes aur{to{transform:translateX(8%) skewX(-6deg);opacity:.8}}
#snow{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:3;pointer-events:none}
.hills{position:absolute;left:0;right:0;bottom:0;height:240px;z-index:1;pointer-events:none}
.hills svg{position:absolute;left:0;bottom:0;width:100%;height:100%}
.tree{position:absolute;bottom:62px;z-index:1;width:120px;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.tree.l{left:-26px}
.tree.r{right:-30px;width:140px;bottom:52px}
.tree .lt{animation:blink 1.6s steps(1) infinite}
.tree .lt:nth-of-type(2n){animation-delay:-.8s}
.tree .lt:nth-of-type(3n){animation-delay:-.4s}
@keyframes blink{50%{opacity:.25}}
.garland{position:absolute;left:-10px;right:-10px;top:0;height:64px;z-index:4;pointer-events:none}
.garland svg{width:100%;height:100%;overflow:visible}
.bulb{animation:blink 1.4s steps(1) infinite}
.bulb:nth-of-type(2n){animation-delay:-.7s}
.bulb:nth-of-type(3n){animation-delay:-.35s}

/* ---------- top bars ---------- */
.status{position:relative;z-index:6;height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 4px;font-weight:600;font-size:15px}
.status .icons{display:flex;gap:6px;align-items:center}
.grab{position:relative;z-index:6;flex:none;align-self:center;width:44px;height:5px;border-radius:3px;margin-top:6px;background:rgba(255,255,255,.6)}
.top{position:relative;z-index:6;flex:none;display:flex;align-items:center;padding:6px 20px 0;height:40px}
.top .more{font-size:22px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.top .get{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.88)}
.close{position:absolute;right:20px;top:12px;width:22px;height:22px;opacity:.85}

.title{position:absolute;left:0;right:0;top:90px;z-index:5;text-align:center;pointer-events:none;transform-origin:50% 0}
.title .h{font-size:17px;font-weight:700;letter-spacing:.32em;color:var(--ice);text-shadow:0 0 12px rgba(160,210,255,.8)}
.title .y{font-size:64px;font-weight:700;line-height:1;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff6c9 0%,#ffd45e 45%,#e8a215 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(255,212,94,.7)) drop-shadow(0 3px 0 #7a4b00)}

/* ---------- gift stage ---------- */
.stage{position:absolute;left:0;right:0;top:calc(50% - 210px);height:420px;z-index:7;touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
.glow{position:absolute;left:50%;bottom:-30px;width:360px;height:300px;margin-left:-180px;border-radius:50%;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 55%,rgba(255,220,120,.45),rgba(255,200,90,.15) 45%,transparent 70%);transition:transform .6s,opacity .6s}
.rays{position:absolute;left:50%;bottom:90px;width:560px;height:560px;margin:0 0 -280px -280px;pointer-events:none;opacity:.35;
  background:repeating-conic-gradient(from 0deg,rgba(255,236,170,.5) 0 7deg,transparent 7deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 58%);mask:radial-gradient(circle,#000 0,transparent 58%);animation:spin 18s linear infinite;transition:opacity .6s}
@keyframes spin{to{transform:rotate(360deg)}}
.stage.open .rays{opacity:.9}
.stage.open .glow{transform:scale(1.25)}

.getlbl{margin-top:12px;text-align:center;pointer-events:none;transition:opacity .35s,transform .35s}
.getlbl span{display:inline-block;padding:7px 22px 8px;border-radius:999px;font-size:26px;font-weight:700;letter-spacing:.14em;color:#fff;
  background:linear-gradient(180deg,rgba(229,48,63,.95),rgba(158,18,34,.95));box-shadow:0 0 0 3px #ffd45e,0 0 24px rgba(255,212,94,.7),0 8px 20px rgba(0,0,0,.4);
  text-shadow:0 2px 0 rgba(0,0,0,.3),0 0 12px rgba(255,236,170,.6);animation:lblpulse 1.8s ease-in-out infinite}
@keyframes lblpulse{50%{transform:scale(1.05);box-shadow:0 0 0 3px #ffe58a,0 0 40px rgba(255,212,94,.95),0 8px 20px rgba(0,0,0,.4)}}
.phone.opened .getlbl{opacity:0;transform:translateY(-14px) scale(.9)}
.box{position:absolute;left:50%;bottom:20px;width:210px;height:190px;margin-left:-105px;z-index:2;animation:wiggle 3.2s ease-in-out infinite}
@keyframes wiggle{0%,78%,100%{transform:rotate(0)}82%{transform:rotate(-4deg)}86%{transform:rotate(4deg)}90%{transform:rotate(-3deg)}94%{transform:rotate(2deg)}}
.stage.open .box{animation:none}
.box.shake{animation:shake .45s ease-in-out}
@keyframes shake{15%{transform:rotate(-6deg) scale(1.02)}35%{transform:rotate(6deg) scale(1.04)}55%{transform:rotate(-5deg) scale(1.04)}75%{transform:rotate(4deg) scale(1.02)}}
.box .body{position:absolute;left:6px;right:6px;bottom:0;height:128px}
.box .lid{position:absolute;left:0;right:0;top:0;height:96px;z-index:3;transform-origin:50% 100%;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.box .lid.drag{transition:none}
.box .lid.fly{transition:transform 1s cubic-bezier(.2,.7,.3,1),opacity 1s;transform:translate(-70px,-560px) rotate(-75deg)!important;opacity:0}
.box svg{width:100%;height:100%;display:block;overflow:visible}
.inner{position:absolute;left:14px;right:14px;top:56px;height:30px;border-radius:6px;z-index:1;opacity:0;background:radial-gradient(60% 120% at 50% 100%,#fff6c9,#ffd45e 40%,rgba(255,180,60,.0) 80%);transition:opacity .4s;filter:blur(2px)}
.stage.open .inner{opacity:1}

.card{position:absolute;left:50%;top:330px;width:118px;margin:-85px 0 0 -59px;z-index:1;opacity:0;pointer-events:none;
  transform:translate(0,30px) scale(.25);transition:transform 1s cubic-bezier(.2,1.25,.35,1),opacity .35s}
.card img{display:block;width:100%;height:auto;border-radius:9px;box-shadow:0 12px 30px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.85),0 0 34px rgba(255,214,110,.55)}
.card .val{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);white-space:nowrap;padding:4px 11px;border-radius:999px;font-weight:700;font-size:15px;color:#3a2300;
  background:linear-gradient(180deg,#ffe58a,#f2a516);box-shadow:0 0 0 2px #fff,0 4px 12px rgba(0,0,0,.4)}
.card .shine{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:9px;overflow:hidden;pointer-events:none}
.card .shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.6s ease-in-out infinite;animation-delay:inherit}
@keyframes shine{0%,55%{left:-60%}85%,100%{left:130%}}
.card.out{opacity:1}

.flash{position:absolute;left:50%;bottom:120px;width:40px;height:40px;margin:0 0 -20px -20px;border-radius:50%;pointer-events:none;z-index:4;opacity:0;
  background:radial-gradient(circle,#fff,rgba(255,240,180,.7) 40%,transparent 70%)}
.flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(14)}}

.hint{position:absolute;left:0;right:0;top:calc(50% + 214px);z-index:7;text-align:center;pointer-events:none;transition:opacity .3s}
.hint .chev{display:flex;flex-direction:column;align-items:center;gap:0;margin-bottom:4px}
.hint .chev svg{width:28px;height:16px;opacity:0;animation:chev 1.4s ease-in-out infinite}
.hint .chev svg:nth-child(1){animation-delay:.4s}
.hint .chev svg:nth-child(2){animation-delay:.2s}
@keyframes chev{0%{opacity:0;transform:translateY(8px)}40%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.hint b{font-size:16px;font-weight:700;letter-spacing:.2em;color:#fff;text-shadow:0 0 14px rgba(160,210,255,.9),0 2px 6px rgba(0,0,0,.5)}
.hint.bounce{animation:hb .5s}
@keyframes hb{30%{transform:translateY(-10px)}60%{transform:translateY(2px)}}
.stage.open ~ .hint{opacity:0}

.result{position:absolute;left:18px;right:18px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:8;text-align:center;opacity:0;transform:translateY(24px);pointer-events:none;transition:opacity .5s,transform .5s cubic-bezier(.2,1.3,.4,1)}
.result.show{opacity:1;transform:none;pointer-events:auto}
.result h2{font-size:22px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.result h2 b{color:var(--gold)}
.result .tot{display:inline-block;margin-top:6px;padding:5px 14px;border-radius:999px;background:rgba(5,12,34,.6);border:1px solid var(--line);font-weight:600;font-size:15px}
.result .tot b{color:var(--gold)}

#confetti{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:9;pointer-events:none}

/* smaller screens */
.phone.short .title{top:84px;transform:scale(.72)}
.phone.short .stage{transform:scale(.88)}
.phone.short .tree{transform:scale(.8);transform-origin:bottom}

/* ---------- buttons + panels ---------- */
.btn{position:relative;display:block;width:100%;margin-top:14px;border:none;border-radius:16px;padding:15px;font-family:inherit;font-weight:700;font-size:17px;color:#fff;cursor:pointer;background:linear-gradient(180deg,#f04552,#b8172a);box-shadow:0 6px 0 #6e0a17,0 10px 26px rgba(229,48,63,.4)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #6e0a17}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:none;margin-top:10px;font-size:15px}
.btn.claim{font-size:20px;padding:16px;background:linear-gradient(180deg,#3cf07a,#12c24f);box-shadow:0 6px 0 #0b7a33,0 0 34px rgba(30,230,100,.55);animation:claim 1.1s ease-in-out infinite}
@keyframes claim{50%{transform:scale(1.04);box-shadow:0 6px 0 #0b7a33,0 0 60px rgba(30,230,100,.8)}}

.modal{position:absolute;top:0;right:0;bottom:0;left:0;z-index:40;background:rgba(3,8,24,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.plaque{position:relative;width:100%;border-radius:26px;padding:3px;text-align:center;
  background:linear-gradient(135deg,#ffd45e,#fff 30%,#7fb6ff 55%,#e5303f 80%,#ffd45e);background-size:300% 300%;animation:shimmer 3s linear infinite;
  box-shadow:0 0 40px rgba(255,212,94,.5),0 0 90px rgba(90,150,255,.45);transform:scale(.7);transition:transform .45s cubic-bezier(.2,1.5,.4,1)}
.modal.open .plaque{transform:scale(1)}
@keyframes shimmer{to{background-position:300% 50%}}
.plaque .in{position:relative;overflow:hidden;border-radius:23px;padding:24px 20px 22px;background:radial-gradient(120% 75% at 50% 0%,#24468e 0%,#132a5e 50%,#0a1736 100%)}
.plaque .prays{position:absolute;left:50%;top:70px;width:540px;height:540px;margin:-270px 0 0 -270px;pointer-events:none;opacity:.4;
  background:repeating-conic-gradient(from 0deg,rgba(255,226,140,.5) 0 8deg,transparent 8deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);animation:spin 14s linear infinite}
.plaque .big{position:relative;width:74px;margin:0 auto;border-radius:7px;box-shadow:0 0 0 2px #fff,0 0 30px rgba(255,214,110,.8);transform:rotate(-6deg)}
.plaque h3{position:relative;font-size:26px;font-weight:700;margin:12px 0 6px;text-shadow:0 0 14px rgba(255,212,94,.6)}
.plaque p{position:relative;color:var(--ice);font-size:15px;line-height:1.45;font-weight:500}
.plaque p b{color:var(--gold)}
.fields{position:relative;margin-top:14px;text-align:left}
.fld span{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 5px 4px}
.fld input{width:100%;font-family:inherit;font-weight:600;font-size:16px;color:#fff;background:rgba(3,10,30,.7);border:1px solid rgba(200,225,255,.35);border-radius:12px;padding:12px 14px;outline:none}
.fld input::placeholder{color:rgba(220,236,255,.4)}
.fld input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,212,94,.22)}
.fld.err input{border-color:#ff5a66;box-shadow:0 0 0 3px rgba(255,90,102,.25);animation:nope .3s}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.profile{position:relative;display:none;align-items:center;gap:12px;margin:14px auto 0;padding:10px 14px 10px 10px;max-width:290px;text-align:left;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);animation:pfIn .35s cubic-bezier(.2,1.4,.4,1)}
.profile.on{display:flex}
@keyframes pfIn{from{opacity:0;transform:scale(.85) translateY(6px)}}
.profile .av{position:relative;flex:none;width:58px;height:58px;border-radius:50%;background:#d5d7da;box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.profile .av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.profile .av i{position:absolute;right:-1px;bottom:1px;width:15px;height:15px;border-radius:50%;background:#00b06f;border:3px solid #132a5e}
.profile .who{min-width:0;flex:1}
.profile .who b{display:block;font-size:16px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile .who span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile .who em{display:inline-block;margin-top:3px;font-style:normal;font-size:12px;font-weight:700;color:#00d084}
.profile .ok{flex:none;width:26px;height:26px;border-radius:50%;background:#00b06f;display:grid;place-items:center;box-shadow:0 0 14px rgba(0,176,111,.6)}
.prog{position:relative;height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:16px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e5303f,#ffd45e);box-shadow:0 0 12px #ffd45e;transition:width .45s}
.step{position:relative;margin-top:10px;min-height:20px;font-size:14px;font-weight:600;color:#fff}

.reveal{position:absolute;top:0;right:0;bottom:0;left:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;
  background:radial-gradient(80% 60% at 50% 35%,#24468e 0%,#0d1d47 60%,#050a18 100%)}
.reveal.open{display:flex;animation:rshake .45s steps(3) 2}
@keyframes rshake{25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,-2px)}}
.reveal .emoji{font-size:96px;line-height:1}
.reveal h1{font-size:48px;font-weight:700;line-height:1;margin-top:14px;color:#fff;text-shadow:0 0 20px rgba(160,210,255,.9),-3px 0 #e5303f,3px 0 #ffd45e}
.reveal p{margin-top:14px;font-size:17px;line-height:1.45;color:var(--ice)}
.reveal .stat{margin-top:20px;background:rgba(5,12,34,.7);border:1px solid var(--line);border-radius:18px;padding:12px 24px;font-weight:600}
.reveal .stat b{display:block;font-size:36px;color:var(--gold)}
.reveal .btn{max-width:280px}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="aurora" aria-hidden="true"></div>

  <div class="hills" aria-hidden="true">
    <svg viewBox="0 0 390 240" preserveAspectRatio="none">
      <defs>
        <linearGradient id="sn1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe3ff"/><stop offset="1" stop-color="#7fa6dd"/></linearGradient>
        <linearGradient id="sn2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f9ff"/><stop offset="1" stop-color="#b9d2f2"/></linearGradient>
      </defs>
      <path d="M0 90C70 50 140 60 210 88S330 70 390 52V240H0Z" fill="url(#sn1)" opacity=".75"/>
      <path d="M0 150C80 112 170 120 240 140S350 130 390 116V240H0Z" fill="url(#sn2)"/>
    </svg>
  </div>
  <svg class="tree l" viewBox="0 0 120 200" aria-hidden="true">
    <rect x="52" y="168" width="16" height="30" fill="#5b3a22"/>
    <path d="M60 4 98 64H78l30 46H84l32 58H4l32-58H12l30-46H22Z" fill="#14563a"/>
    <path d="M60 4 76 30c-8 4-22 4-32 0Zm-20 52c10 6 30 6 42 0l6 8H32Zm-14 52c14 8 52 8 70 0l6 10H18Z" fill="#eef6ff" opacity=".9"/>
    <circle class="lt" cx="50" cy="78" r="4" fill="#ff5a5a"/><circle class="lt" cx="74" cy="92" r="4" fill="#ffd45e"/><circle class="lt" cx="40" cy="128" r="4" fill="#5ac8ff"/><circle class="lt" cx="80" cy="140" r="4" fill="#ff5a5a"/><circle class="lt" cx="58" cy="152" r="4" fill="#7dff8a"/><circle class="lt" cx="62" cy="50" r="4" fill="#5ac8ff"/>
  </svg>
  <svg class="tree r" viewBox="0 0 120 200" aria-hidden="true">
    <rect x="52" y="168" width="16" height="30" fill="#5b3a22"/>
    <path d="M60 4 98 64H78l30 46H84l32 58H4l32-58H12l30-46H22Z" fill="#11492f"/>
    <path d="M60 4 76 30c-8 4-22 4-32 0Zm-20 52c10 6 30 6 42 0l6 8H32Zm-14 52c14 8 52 8 70 0l6 10H18Z" fill="#eef6ff" opacity=".9"/>
    <path d="M60 0l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z" fill="#ffd45e"/>
    <circle class="lt" cx="48" cy="84" r="4" fill="#ffd45e"/><circle class="lt" cx="72" cy="76" r="4" fill="#ff5a5a"/><circle class="lt" cx="36" cy="134" r="4" fill="#7dff8a"/><circle class="lt" cx="84" cy="126" r="4" fill="#5ac8ff"/><circle class="lt" cx="60" cy="146" r="4" fill="#ff5a5a"/>
  </svg>

  <div class="garland" aria-hidden="true">
    <svg viewBox="0 0 410 64" preserveAspectRatio="none">
      <path d="M0 6Q50 46 100 14T200 14 300 14 410 10" fill="none" stroke="#1d2b3a" stroke-width="2"/>
      <g>
        <circle class="bulb" cx="22" cy="22" r="5" fill="#ff5a5a" style="filter:drop-shadow(0 0 6px #ff5a5a)"/>
        <circle class="bulb" cx="50" cy="31" r="5" fill="#ffd45e" style="filter:drop-shadow(0 0 6px #ffd45e)"/>
        <circle class="bulb" cx="78" cy="25" r="5" fill="#5ac8ff" style="filter:drop-shadow(0 0 6px #5ac8ff)"/>
        <circle class="bulb" cx="112" cy="14" r="5" fill="#7dff8a" style="filter:drop-shadow(0 0 6px #7dff8a)"/>
        <circle class="bulb" cx="146" cy="27" r="5" fill="#ff5a5a" style="filter:drop-shadow(0 0 6px #ff5a5a)"/>
        <circle class="bulb" cx="176" cy="24" r="5" fill="#ffd45e" style="filter:drop-shadow(0 0 6px #ffd45e)"/>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const CARD = document.querySelector('.plaque .big').src;   // the gift card picture (embedded once)

  // fit the 390px-wide design to any screen
  const phoneEl = $('phone'); let S = 1;
  function fit(){
    const vv = window.visualViewport, W = vv ? vv.width : innerWidth, H = vv ? vv.height : innerHeight;
    let h;
    if (W < 500){ S = W / 390; h = H / S; }
    else { S = Math.min(1, (H - 40) / 844, (W - 40) / 390); h = 844; }
    phoneEl.style.height = h + 'px';
    phoneEl.style.transform = 'scale(' + S + ')';
    phoneEl.classList.toggle('short', h < 760);
  }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', () => setTimeout(fit, 150));
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);

  const fmt = n => n.toLocaleString('en-US');
  const short = n => { const u=[[1e9,'B'],[1e6,'M'],[1e3,'K']]; for (const [v,s] of u) if (n >= v) return (+(n/v).toFixed(n/v < 10 ? 1 : 0)) + s; return String(n); };
  const clock = () => { const d = new Date(); $('clock').textContent = (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2,'0'); };
  clock(); setInterval(clock, 10000);

  // ---------- swipe up to open ----------
  const stage = $('stage'), box = $('box'), lid = $('lid'), hint = $('hint');
  const VALUES = [400, 800, 1700, 2000, 4500, 10000];
  let opened = false, startY = null, dy = 0, total = 0;

  stage.addEventListener('pointerdown', e => {
    if (opened) return;
    startY = e.clientY; dy = 0;
    lid.classList.add('drag');
    try { stage.setPointerCapture(e.pointerId); } catch(_){}
  });
  stage.addEventListener('pointermove', e => {
    if (startY === null || opened) return;
    dy = (startY - e.clientY) / S;
    const lift = Math.max(0, Math.min(80, dy * .6));
    lid.style.transform = 'translateY(' + (-lift) + 'px) rotate(' + (-lift * .12) + 'deg)';
    if (dy > 90) openBox();
  });
  function release(){
    if (startY === null) return;
    startY = null; lid.classList.remove('drag');
    if (opened) return;
    lid.style.transform = '';
    if (Math.abs(dy) < 10){ hint.classList.remove('bounce'); void hint.offsetWidth; hint.classList.add('bounce'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); }
  }
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  addEventListener('keydown', e => { if (!opened && (e.key === 'ArrowUp' || e.key === ' ')) openBox(); });

  function openBox(){
    if (opened) return;
    opened = true; startY = null; phoneEl.classList.add('opened');
    lid.classList.remove('drag');
    if (navigator.vibrate) try { navigator.vibrate([20,40,30]); } catch(_){}
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    setTimeout(() => {
      lid.classList.add('fly');
      stage.classList.add('open');
      const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
      confettiBurst();
      // three gift cards come out and fan open
      const wrap = $('cards'); wrap.innerHTML = '';
      const picks = [...VALUES].sort(() => Math.random() - .5).slice(0, 3);
      total = picks.reduce((a, b) => a + b, 0);
      const spots = [[-112, -196, -14], [0, -238, 0], [112, -196, 14]];
      picks.forEach((v, i) => {
        const c = document.createElement('div'); c.className = 'card';
        c.innerHTML = '<img alt="" src="' + CARD + '"><div class="shine" style="animation-delay:' + (1.2 + i * .3) + 's"></div><div class="val">' + fmt(v) + ' R$</div>';
        c.style.zIndex = i === 1 ? 2 : 1;
        wrap.appendChild(c);
        setTimeout(() => {
          const [x, y, r] = spots[i];
          c.classList.add('out');
          c.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + r + 'deg) scale(1)';
        }, 120 + i * 170);
      });
      $('totTxt').textContent = fmt(total) + ' Robux';
      setTimeout(() => $('result').classList.add('show'), 1300);
    }, 420);
  }

  // ---------- redeem flow (username → profile → congratulations → claim → prank) ----------
  const open = id => $(id).classList.add('open');
  const close = m => m.classList.remove('open');
  document.querySelectorAll('.modal').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) close(m); });
  });
  let nick = '';
  const nickIn = $('exNick');
  nickIn.addEventListener('input', () => $('nickFld').classList.remove('err'));
  function flagErr(id){ const f = $(id); f.classList.remove('err'); void f.offsetWidth; f.classList.add('err'); }

  $('redeemBtn').onclick = () => {
    $('exProgWrap').style.display = 'none'; $('exStep').textContent = '';
    $('exGo').style.display = ''; $('exCancel').style.display = ''; $('claimBtn').style.display = 'none';
    $('exFields').style.display = ''; $('exProfile').classList.remove('on'); $('nickFld').classList.remove('err');
    $('exTitle').textContent = 'Redeem ' + fmt(total) + ' Robux';
    $('exText').textContent = 'Enter your username to add the gift cards to your account.';
    open('exModal');
  };
  $('exGo').onclick = () => {
    nick = nickIn.value.trim();
    if (!nick){ flagErr('nickFld'); return; }
    if (document.activeElement) document.activeElement.blur();
    $('exFields').style.display = 'none';
    $('exGo').style.display = 'none'; $('exCancel').style.display = 'none';
    $('exTitle').textContent = 'Sending…';
    $('exText').textContent = '@' + nick + ' · ' + fmt(total) + ' Robux';
    $('exProgWrap').style.display = ''; const bar = $('exProg'); bar.style.width = '0';
    const steps = ['Connecting to server…', 'Finding @' + nick + '…', 'Checking gift cards…', 'Adding ' + short(total) + ' Robux to @' + nick + '…', 'Almost done…'];
    let i = 0;
    const tick = () => {
      if (i < steps.length){
        $('exStep').textContent = steps[i];
        bar.style.width = ((i + 1) / steps.length * 100) + '%';
        if (i === 2){ $('pfName').textContent = nick; $('pfUser').textContent = '@' + nick; $('exProfile').classList.add('on'); }
        i++; setTimeout(tick, i === 2 ? 700 : 220 + Math.random() * 280);
      } else {
        $('exTitle').textContent = 'Congratulations!';
        const t = $('exText'); t.textContent = '';
        t.append('🎉 @' + nick + ' got ');
        const bb = document.createElement('b'); bb.textContent = fmt(total) + ' Robux'; t.append(bb, '!');
        t.append(document.createElement('br'), 'Tap below to add them to your account.');
        $('exProgWrap').style.display = 'none'; $('exStep').textContent = '';
        $('claimBtn').style.display = '';
        confettiBurst();
        if (navigator.vibrate) try { navigator.vibrate([40,30,40]); } catch(_){}
      }
    };
    tick();
  };
  $('claimBtn').onclick = () => {
    close($('exModal'));
    $('revealText').textContent = 'Sorry @' + nick + ', these gift cards aren’t real. Happy New Year anyway!';
    $('reveal').classList.add('open');
    if (navigator.vibrate) try { navigator.vibrate([60,40,60]); } catch(_){}
  };
  $('again').onclick = () => {
    $('reveal').classList.remove('open');
    opened = false; stage.classList.remove('open'); phoneEl.classList.remove('opened');
    lid.classList.remove('fly'); lid.style.transform = '';
    $('cards').innerHTML = ''; $('result').classList.remove('show');
  };

  // ---------- snow + stars ----------
  (function snow(){
    const c = $('snow'), ctx = c.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2);
    let W = 0, H = 0, flakes = [], stars = [];
    function size(){
      W = c.offsetWidth; H = c.offsetHeight; c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      flakes = Array.from({length: 90}, () => mk(true));
      stars = Array.from({length: 40}, () => ({ x: Math.random() * W, y: 60 + Math.random() * H * .35, r: Math.random() * 1.2 + .3, ph: Math.random() * 6.28 }));
    }
    const mk = any => ({ x: Math.random() * W, y: any ? Math.random() * H : -10, r: Math.random() * 2.6 + .8, vy: Math.random() * 30 + 22, sw: Math.random() * 6.28, sp: Math.random() * 1.2 + .4 });
    let last = performance.now();
    function frame(t){
      const dt = Math.min(.05, (t - last) / 1000); last = t;
      ctx.clearRect(0,0,W,H);
      for (const s of stars){ s.ph += dt * 2; ctx.globalAlpha = .35 + Math.sin(s.ph) * .3; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }
      ctx.fillStyle = '#fff';
      for (const f of flakes){
        f.y += f.vy * dt * (f.r / 2.2); f.sw += dt * f.sp; f.x += Math.sin(f.sw) * .4;
        if (f.y > H + 10) Object.assign(f, mk(false));
        ctx.globalAlpha = .55 + f.r / 8; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(frame);
    }
    if (window.ResizeObserver) new ResizeObserver(size).observe(c); else addEventListener('resize', size);
    size(); requestAnimationFrame(frame);
  })();

  // ---------- confetti ----------
  const cf = $('confetti'), cx = cf.getContext('2d'); let bits = [], running = false;
  function confettiBurst(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2), W = cf.offsetWidth, H = cf.offsetHeight;
    cf.width = W * dpr; cf.height = H * dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    const sr = stage.getBoundingClientRect(), pr = phoneEl.getBoundingClientRect();
    const ox = W / 2, oy = (sr.top - pr.top) / S + 300;
    const cols = ['#ffd45e','#ff5a66','#5ac8ff','#7dff8a','#ffffff','#c49bff'];
    for (let i = 0; i < 140; i++){
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, v = 260 + Math.random() * 420;
      bits.push({ x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 5 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6.28, vr: (Math.random() - .5) * 14, c: cols[i % cols.length], life: 2.6 + Math.random() });
    }
    if (!running){ running = true; let last = performance.now();
      (function f(t){
        const dt = Math.min(.05, (t - last) / 1000); last = t;
        cx.clearRect(0,0,W,H);
        bits = bits.filter(b => (b.life -= dt) > 0);
        for (const b of bits){
          b.vy += 520 * dt; b.vx *= .99; b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
          cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.globalAlpha = Math.min(1, b.life); cx.fillStyle = b.c; cx.fillRect(-b.w/2, -b.h/2, b.w, b.h * Math.abs(Math.cos(b.r * 1.3))); cx.restore();
        }
        if (bits.length) requestAnimationFrame(f); else { running = false; cx.clearRect(0,0,W,H); }
      })(last);
    }
